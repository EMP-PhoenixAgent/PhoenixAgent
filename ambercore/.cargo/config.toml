# Build configuration for AmberCore.
#
# `target-cpu=native` makes rustc emit SIMD instructions (AVX2/F16C on Intel,
# NEON on ARM) for the building machine's exact CPU. This is a *big* deal for
# AmberCore: candle's quantized matmul kernels have AVX2 code paths that roughly
# **3x** CPU inference throughput (measured: 11.5 → 34.4 tok/s on a Qwen2-0.5B
# with an i5-12500).
#
# Trade-off: binaries built this way are NOT portable — they'll crash on CPUs
# lacking the features. For local use (AmberCore's mission), that's fine. For
# distributing a binary, build on a baseline target instead.
#
# Override at build time with:  RUSTFLAGS="-C target-cpu=x86-64" cargo build ...

[build]
rustflags = ["-C", "target-cpu=native"]
